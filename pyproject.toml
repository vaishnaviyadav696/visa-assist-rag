[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "visa-assist"
version = "0.1.0"
description = "Post-application visa-support assistant"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13,<2.0",
    "pydantic-settings>=2.0,<3.0",
    "SQLAlchemy>=2.0,<3.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
